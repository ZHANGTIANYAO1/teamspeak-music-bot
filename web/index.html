<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Keep deployed instances out of search-engine indexes (issue #128:
       searching "TsmusicBot" surfaced strangers' WebUI URLs). Defence in depth
       alongside the server's X-Robots-Tag header and /robots.txt. Applies to
       the SPA shell and every in-app route (incl. /bot/<id> dedicated links),
       since they all share this single index.html. -->
  <meta name="robots" content="noindex, nofollow">
  <!-- Bilibili / NetEase / QQ image CDNs reject requests whose Referer is not on
       their whitelist, so we must not leak a Referer cross-origin. "same-origin"
       does exactly that: full Referer for our own requests, none for cross-origin
       ones — so cover thumbnails (<img> AND CSS background-image) still load.
       Do NOT switch this back to "no-referrer": per the WHATWG Fetch spec
       ("Append a request Origin header") no-referrer downgrades the Origin header
       to the literal string "null" on same-origin non-GET requests. The /api/*
       CSRF guard (src/web/middleware/csrf.ts) then can't parse a host from it and
       responds 403 "bad origin", silently breaking EVERY POST/PUT/DELETE — QR
       login, cookie save, playback controls, bot management, user admin, etc.
       "same-origin" keeps the real Origin on same-origin requests, so CSRF passes. -->
  <meta name="referrer" content="same-origin">
  <title>TSMusicBot</title>
  <!-- Icons live in web/public/ so Vite copies them to the dist root, which is
       what Express serves (src/index.ts STATIC_DIR). Both an .ico and an .svg
       are declared: browsers that understand the vector one prefer it and stay
       sharp on hi-dpi tabs, the rest fall back to the .ico. The .ico also
       answers the implicit /favicon.ico request — without a real file there the
       SPA catch-all hands back index.html with a 200, so the tab silently keeps
       the blank-page icon (issue #142). -->
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
  <!-- iOS home-screen icon; iOS masks the corners itself, so this one is a
       full square. Android reads the manifest instead. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- Matches --bg-primary of the dark theme, which is what the app starts in
       (stores/player.ts defaults to 'dark' and never follows the OS scheme). -->
  <meta name="theme-color" content="#222222">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
